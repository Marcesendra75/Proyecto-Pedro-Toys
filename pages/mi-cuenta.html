<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Toys - Mi Cuenta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="body-mi-cuenta">

    <header class="header">
        <nav class="navegador">
            <div class="menu-toggle" id="mobile-menu">
                <i class="fa-solid fa-bars"></i>
            </div>
            <ul class="nav-list">
                <li class="ul__li"><i class="fa-solid fa-house"></i><a href="../index.html">Inicio</a></li>
                <li class="ul__li"><i class="fa-solid fa-robot"></i><a href="../pages/juguetes.html">Juguetes</a></li>
                <li class="ul__li"><i class="fa-solid fa-graduation-cap"></i><a href="../pages/educando.html">Educando</a></li>
            </ul>
        </nav>
    </header>

    <main class="container text-center mt-5">
        <h2 class="animate__animated animate__fadeInDown">Mi cuenta</2>
        
        <h2 class="account">Crear cuenta</h2>

        <form class="formulario">
            <div class="input-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </div>
            
            <div class="input-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required placeholder="Tu apellido">
            </div>

            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="nombre@mail.com">
            </div>

            <div class="input-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="nro. tel">
            </div>

            <button type="submit" class="register-btn">Ingresar</button>
        </form>
    </main>
  
    <footer class="pie" >
        <div class="redes-sociales">
          <h4 class="copyright">Copyright todos los derechos reservados</h4>
          
          <img src="../imagenes/derechos.png" alt="Icono derechos" class="icono-red-social">
              <a href="https://www.instagram.com" target="_blank">
              <img src="../imagenes/logo-insta.png" alt="Instagram" class="icono-red-social">   
              </a><a href="https://www.facebook.com" target="_blank">
              <img src="../imagenes/facebook.png" alt="Instagram" class="icono-red-social">   
                 </a>
              </div>
      
          </footer>>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    
        const menuToggle = document.getElementById('mobile-menu');
        const navList = document.querySelector('.nav-list');
        menuToggle.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>
</body>
</html>
